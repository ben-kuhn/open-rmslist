name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: go test (with coverage)
        run: go test -coverprofile=coverage.out ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: coverage floor
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "total coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { if (t+0 < 50) { print "::error::coverage " t "% is below the 50% floor"; exit 1 } }'
      - name: upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, artos: linux }
          - { goos: linux,   goarch: arm64, artos: linux }
          - { goos: linux,   goarch: arm,   artos: linux }
          - { goos: darwin,  goarch: amd64, artos: macos }
          - { goos: darwin,  goarch: arm64, artos: macos }
          - { goos: windows, goarch: amd64, artos: windows }
          - { goos: windows, goarch: arm64, artos: windows }
          - { goos: freebsd, goarch: amd64, artos: freebsd }
          - { goos: openbsd, goarch: amd64, artos: openbsd }
          - { goos: netbsd,  goarch: amd64, artos: netbsd }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}" .
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}
          path: dist/rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}

  e2e:
    name: Browser tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: start the server
        run: |
          go build -o /tmp/rms-radar .
          /tmp/rms-radar -d -listen 127.0.0.1:8079 -cache-dir /tmp/rms-data > /tmp/rms-radar.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8079/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8079/api/health
      - name: install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: run browser tests
        working-directory: tests/e2e
        env:
          BASE_URL: http://127.0.0.1:8079
        run: npx playwright test

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: install MinGW for Windows CGo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: build native desktop binary
        shell: bash
        run: ./scripts/build-desktop.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist-desktop/*

  voacap:
    name: VOACAP bundle (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
      - name: install gfortran (macOS)
        if: runner.os == 'macOS'
        run: brew install gfortran || brew install gcc
      - name: build bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          OUT: dist-voacap
        run: ./scripts/build-voacap.sh
      - name: unpack bundle for smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/voacap-bundle"
          tar -xzf dist-voacap/voacap-*.tar.gz -C "$RUNNER_TEMP/voacap-bundle"
      - name: smoke-test engine (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          RMSRADAR_TEST_VOACAP_EXECUTABLE: ${{ runner.temp }}/voacap-bundle/voacap/voacapl
          RMSRADAR_TEST_VOACAP_DATA_DIR: ${{ runner.temp }}/voacap-bundle/voacap/itshfbc
        run: go test ./internal/propagation -run TestVOACAPLocalRealEngine -v -count=1
      - name: assemble bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist-voacap | Out-Null
          New-Item -ItemType Directory -Force work | Out-Null
          Invoke-WebRequest -Uri "https://greg-hand.com/versions/itshfbc%20.zap" -OutFile "work/itshfbc.zip"
          $expected = "29d3902c695523841dae395db937cda4f154a9e2cbe9aed38f38bd1f98d42e9a"
          $actual = (Get-FileHash "work/itshfbc.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "upstream VOACAP archive SHA-256 mismatch: got $actual" }
          Expand-Archive -Path "work/itshfbc.zip" -DestinationPath "work/win"
          if (-not (Test-Path "work/win/itshfbc/bin_win/voacapw.exe")) { throw "voacapw.exe missing from upstream archive" }
          if (-not (Test-Path "work/win/itshfbc/bin_win/SALFLIBC.DLL")) { throw "SALFLIBC.DLL missing from upstream archive" }
          Compress-Archive -Path "work/win/itshfbc" -DestinationPath "dist-voacap/voacap-windows-amd64.zip" -Force
          $hash = (Get-FileHash "dist-voacap/voacap-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  voacap-windows-amd64.zip" | Out-File -FilePath "dist-voacap/voacap-windows-amd64.zip.sha256" -Encoding ascii
      - name: smoke-test engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RMSRADAR_TEST_VOACAP_EXECUTABLE: ${{ github.workspace }}\work\win\itshfbc\bin_win\voacapw.exe
          RMSRADAR_TEST_VOACAP_DATA_DIR: ${{ github.workspace }}\work\win\itshfbc
        run: go test ./internal/propagation -run TestVOACAPLocalRealEngine -v -count=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voacap-${{ matrix.os }}
          path: dist-voacap/*
