name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: go test (with coverage)
        run: go test -coverprofile=coverage.out ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: coverage floor
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "total coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { if (t+0 < 50) { print "::error::coverage " t "% is below the 50% floor"; exit 1 } }'
      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, artos: linux }
          - { goos: linux,   goarch: arm64, artos: linux }
          - { goos: linux,   goarch: arm,   artos: linux }
          - { goos: darwin,  goarch: amd64, artos: macos }
          - { goos: darwin,  goarch: arm64, artos: macos }
          - { goos: windows, goarch: amd64, artos: windows }
          - { goos: windows, goarch: arm64, artos: windows }
          - { goos: freebsd, goarch: amd64, artos: freebsd }
          - { goos: openbsd, goarch: amd64, artos: openbsd }
          - { goos: netbsd,  goarch: amd64, artos: netbsd }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}" .
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}
          path: dist/rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}

  e2e:
    name: Browser tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: start the server
        run: |
          go build -o /tmp/rms-radar .
          /tmp/rms-radar -d -listen 127.0.0.1:8079 -cache-dir /tmp/rms-data > /tmp/rms-radar.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8079/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8079/api/health
      - name: install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: run browser tests
        working-directory: tests/e2e
        env:
          BASE_URL: http://127.0.0.1:8079
        run: npx playwright test

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: install MinGW for Windows CGo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: build native desktop binary
        shell: bash
        run: ./scripts/build-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist-desktop/*
