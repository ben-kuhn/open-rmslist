name: Test sign

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: verify the signing secret
        env:
          KEY: ${{ secrets.VOACAP_MINISIGN_SECRET_KEY }}
        run: |
          test -n "$KEY"
          echo hello > /tmp/payload
          printf '%s\n' "$KEY" > /tmp/key
          minisign -S -s /tmp/key -m /tmp/payload -x /tmp/payload.minisig
          minisign -V -P "RWQoKUnh2RVOrHnNGpIBq61ECRNk8+eL93Sn5dhdm2te75Zz7lOkUSZt" -m /tmp/payload -x /tmp/payload.minisig
