name: Packaging

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rpm:
    name: RPM (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5
      - name: build RPM
        run: |
          dnf -y install golang rpm-build systemd-rpm-macros
          cd "$GITHUB_WORKSPACE"
          VERSION="$(sed -n 's/^var version = "\([^"]*\)"/\1/p' main.go)"
          [ -n "$VERSION" ] || { echo "could not determine version" >&2; exit 1; }
          PREFIX="rms-radar-${VERSION}"
          mkdir -p "$HOME/rpmbuild/SOURCES"
          # Source0 points at the GitHub tag, which may not exist yet; build a
          # local tarball with the same layout for validation.
          tar -czf "$HOME/rpmbuild/SOURCES/${PREFIX}.tar.gz" \
            --exclude=.git --transform "s,^\\./,${PREFIX}/," .
          rpmbuild -ba packaging/rpm/rms-radar.spec

  arch:
    name: Arch (PKGBUILD)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: build PKGBUILD
        run: |
          pacman -Sy --noconfirm --needed base-devel go
          useradd -m builder
          cd "$GITHUB_WORKSPACE"
          VERSION="$(sed -n 's/^var version = "\([^"]*\)"/\1/p' main.go)"
          [ -n "$VERSION" ] || { echo "could not determine version" >&2; exit 1; }
          PREFIX="rms-radar-${VERSION}"
          # PKGBUILD source points at the GitHub tag; drop a local tarball with
          # the same name so makepkg uses it instead of downloading.
          tar -czf "packaging/arch/${PREFIX}.tar.gz" \
            --exclude=.git --transform "s,^\\./,${PREFIX}/," .
          chown -R builder:builder .
          # CI builds a local tarball from the current commit, so the pinned
          # release sha256 won't match; skip checksum validation here (it is
          # enforced when packaging a real release).
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm --skipchecksums"

  nix:
    name: Nix (buildGoModule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: checkout nix-ham-packages
        run: git clone --depth 1 https://github.com/ben-kuhn/nix-ham-packages.git /tmp/nix-ham-packages
      - name: build rms-radar package
        run: |
          nix build --impure --expr \
            "(import <nixpkgs> {}).callPackage /tmp/nix-ham-packages/rms-radar { src = $GITHUB_WORKSPACE; }"
