name: Packaging

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rpm:
    name: RPM (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: build RPM
        run: |
          dnf -y install golang rpm-build systemd-rpm-macros
          cd "$GITHUB_WORKSPACE"
          VERSION="$(sed -n 's/^var version = "\([^"]*\)"/\1/p' shared.go)"
          [ -n "$VERSION" ] || { echo "could not determine version" >&2; exit 1; }
          PREFIX="rms-radar-${VERSION}"
          mkdir -p "$HOME/rpmbuild/SOURCES" "$HOME/rpmbuild/SPECS"
          # Source0 points at the GitHub tag, which may not exist yet; build a
          # local tarball with the same layout for validation.
          tar -czf "$HOME/rpmbuild/SOURCES/${PREFIX}.tar.gz" \
            --exclude=.git --transform "s,^\\./,${PREFIX}/," .
          rpmbuild -ba packaging/rpm/rms-radar.spec

          # Validate the desktop spec without spending CI time on a second
          # WebKitGTK CGo build. The release workflow packages the real binary
          # from the Linux desktop job.
          printf '#!/bin/sh\nexit 0\n' > "$HOME/rpmbuild/SOURCES/rms-radar-desktop"
          chmod 755 "$HOME/rpmbuild/SOURCES/rms-radar-desktop"
          cp contrib/desktop/rms-radar-desktop.desktop \
            contrib/desktop/rms-radar.svg \
            contrib/desktop/rms-radar-1024.png \
            LICENSE "$HOME/rpmbuild/SOURCES/"
          sed "s/^Version:.*/Version: ${VERSION}/" \
            packaging/rpm/rms-radar-desktop.spec > "$HOME/rpmbuild/SPECS/rms-radar-desktop.spec"
          rpmbuild -bb "$HOME/rpmbuild/SPECS/rms-radar-desktop.spec"

  arch:
    name: Arch (PKGBUILD)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: build PKGBUILD
        run: |
          pacman -Sy --noconfirm --needed base-devel go
          useradd -m builder
          cd "$GITHUB_WORKSPACE"
          VERSION="$(sed -n 's/^var version = "\([^"]*\)"/\1/p' shared.go)"
          [ -n "$VERSION" ] || { echo "could not determine version" >&2; exit 1; }
          PREFIX="rms-radar-${VERSION}"
          # PKGBUILD source points at the GitHub tag; drop a local tarball with
          # the same name so makepkg uses it instead of downloading.
          # Write outside the source tree so tar cannot read its own output.
          tar -czf "/tmp/${PREFIX}.tar.gz" \
            --exclude=.git --transform "s,^\\./,${PREFIX}/," .
          mv "/tmp/${PREFIX}.tar.gz" "packaging/arch/${PREFIX}.tar.gz"
          # Validate the local tarball instead of bypassing checksums.
          SHA="$(sha256sum "packaging/arch/${PREFIX}.tar.gz" | awk '{print $1}')"
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" packaging/arch/PKGBUILD
          chown -R builder:builder .
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm"

          # Validate the desktop package layout with a stub binary; the release
          # workflow replaces it with the tested CGo/WebKitGTK build.
          printf '#!/bin/sh\nexit 0\n' > packaging/arch/rms-radar-desktop
          chmod 755 packaging/arch/rms-radar-desktop
          cp contrib/desktop/rms-radar-desktop.desktop \
            contrib/desktop/rms-radar.svg \
            contrib/desktop/rms-radar-1024.png \
            LICENSE packaging/arch/
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD.desktop
          chown -R builder:builder .
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg -p PKGBUILD.desktop --noconfirm --nodeps"

  nix:
    name: Nix (buildGoModule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: checkout nix-ham-packages
        run: git clone --depth 1 https://github.com/ben-kuhn/nix-ham-packages.git /tmp/nix-ham-packages
      - name: build rms-radar package
        run: |
          nix build --impure --expr \
            "(import <nixpkgs> {}).callPackage /tmp/nix-ham-packages/rms-radar { src = $GITHUB_WORKSPACE; }"
