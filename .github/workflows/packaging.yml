name: Packaging

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rpm:
    name: RPM (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: build RPM
        run: |
          dnf -y install golang rpm-build systemd-rpm-macros
          mkdir -p ~/rpmbuild/SOURCES
          cd "$GITHUB_WORKSPACE"
          # Source0 points at the GitHub tag, which may not exist yet; build a
          # local tarball with the same layout for validation.
          tar -czf ~/rpmbuild/SOURCES/open-rmslist-0.1.0.tar.gz \
            --exclude=.git --transform 's,^\./,open-rmslist-0.1.0/,' .
          rpmbuild -ba packaging/rpm/open-rmslist.spec

  arch:
    name: Arch (PKGBUILD)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: build PKGBUILD
        run: |
          pacman -Sy --noconfirm --needed base-devel go
          useradd -m builder
          cd "$GITHUB_WORKSPACE"
          # PKGBUILD source points at the GitHub tag; drop a local tarball with
          # the same name so makepkg uses it instead of downloading.
          tar -czf packaging/arch/open-rmslist-0.1.0.tar.gz \
            --exclude=.git --transform 's,^\./,open-rmslist-0.1.0/,' .
          chown -R builder:builder .
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm"

  nix:
    name: Nix (buildGoModule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: checkout nix-ham-packages
        run: git clone --depth 1 https://github.com/ben-kuhn/nix-ham-packages.git /tmp/nix-ham-packages
      - name: build open-rmslist package
        run: |
          nix build --impure --expr \
            "(import <nixpkgs> {}).callPackage /tmp/nix-ham-packages/open-rmslist { src = $GITHUB_WORKSPACE; }"
