name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    name: Web/server artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build + package
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          OUT: dist
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: install MinGW for Windows CGo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\\ProgramData\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: build + package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          OUT: dist-desktop
        run: ./scripts/build-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist-desktop/*

  publish:
    name: Publish release
    needs: [web, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: combine checksums
        run: |
          find artifacts -name checksums.txt -delete
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            SHA256SUMS
