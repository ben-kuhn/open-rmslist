name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  web:
    name: Web/server artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: build + package
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          OUT: dist
        run: ./scripts/build-release.sh
      - name: build Debian server packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          for pair in amd64:amd64 arm64:arm64 arm:armhf; do
            goarch="${pair%%:*}"
            debarch="${pair##*:}"
            bin="dist/rms-radar-web-${VER}-linux-${goarch}"
            [ -f "$bin" ] || { echo "missing $bin" >&2; exit 1; }
            OUT=dist ./scripts/build-deb.sh "$bin" rms-radar "$VER" "$debarch" web
          done
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: install MinGW for Windows CGo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\\ProgramData\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: build + package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          OUT: dist-desktop
        run: ./scripts/build-desktop.sh
      - name: build Debian desktop package
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          bin="dist-desktop/rms-radar-desktop-${VER}-linux-amd64"
          [ -f "$bin" ] || { echo "missing $bin" >&2; exit 1; }
          OUT=dist-desktop ./scripts/build-deb.sh "$bin" rms-radar-desktop "$VER" amd64 desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist-desktop/*

  rpm:
    name: RPM package
    needs: verify
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5
      - name: build RPM
        run: |
          dnf -y install golang rpm-build systemd-rpm-macros
          cd "$GITHUB_WORKSPACE"
          VER="${GITHUB_REF_NAME#v}"
          PREFIX="rms-radar-${VER}"
          mkdir -p "$HOME/rpmbuild/SOURCES"
          tar -czf "$HOME/rpmbuild/SOURCES/${PREFIX}.tar.gz" \
            --exclude=.git --transform "s,^\\./,${PREFIX}/," .
          rpmbuild -ba packaging/rpm/rms-radar.spec
          mkdir -p dist-rpm
          cp "$HOME/rpmbuild/RPMS"/*/*.rpm dist-rpm/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist-rpm/*

  arch:
    name: Arch package
    needs: verify
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: build Arch package
        run: |
          pacman -Sy --noconfirm --needed base-devel go
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm --skipchecksums"
          mkdir -p dist-arch
          cp packaging/arch/*.pkg.tar.zst dist-arch/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist-arch/*

  voacap-linux:
    name: VOACAP bundle (Linux)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
      - name: build bundle
        env:
          OUT: dist-voacap
          GOOS: linux
          GOARCH: amd64
        run: ./scripts/build-voacap.sh
      - uses: actions/upload-artifact@v4
        with:
          name: voacap-linux
          path: dist-voacap/*

  voacap-macos:
    name: VOACAP bundle (macOS)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: install gfortran
        run: brew install gfortran || brew install gcc
      - name: build bundle
        env:
          OUT: dist-voacap
          GOOS: darwin
          GOARCH: arm64
        run: ./scripts/build-voacap.sh
      - uses: actions/upload-artifact@v4
        with:
          name: voacap-macos
          path: dist-voacap/*

  voacap-windows:
    name: VOACAP bundle (Windows)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: assemble bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist-voacap | Out-Null
          New-Item -ItemType Directory -Force work | Out-Null
          # Upstream's official Windows distribution (engine, data, runtime DLL).
          Invoke-WebRequest -Uri "https://greg-hand.com/versions/itshfbc%20.zap" -OutFile "work/itshfbc.zip"
          Expand-Archive -Path "work/itshfbc.zip" -DestinationPath "work/win"
          if (-not (Test-Path "work/win/itshfbc/bin_win/voacapw.exe")) { throw "voacapw.exe missing from upstream archive" }
          if (-not (Test-Path "work/win/itshfbc/bin_win/SALFLIBC.DLL")) { throw "SALFLIBC.DLL missing from upstream archive" }
          Compress-Archive -Path "work/win/itshfbc" -DestinationPath "dist-voacap/voacap-windows-amd64.zip" -Force
          $hash = (Get-FileHash "dist-voacap/voacap-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  voacap-windows-amd64.zip" | Out-File -FilePath "dist-voacap/voacap-windows-amd64.zip.sha256" -Encoding ascii
      - name: smoke-test the engine
        shell: pwsh
        env:
          RMSRADAR_TEST_VOACAP_EXECUTABLE: ${{ github.workspace }}\work\win\itshfbc\bin_win\voacapw.exe
          RMSRADAR_TEST_VOACAP_DATA_DIR: ${{ github.workspace }}\work\win\itshfbc
        run: go test ./internal/propagation -run TestVOACAPLocalRealEngine -v -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: voacap-windows
          path: dist-voacap/*

  publish:
    name: Publish release
    needs: [web, desktop, rpm, arch, voacap-linux, voacap-macos, voacap-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: combine checksums
        run: |
          find artifacts -name checksums.txt -delete
          (cd artifacts && find . -type f -print0 | sort -z | xargs -0 sha256sum \
            | sed -E 's#  \./[^/]+/#  #; s#  \./#  #') > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            SHA256SUMS
